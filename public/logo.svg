<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <defs>
    <linearGradient id="goldShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C068"/>
      <stop offset="50%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#B8922E"/>
    </linearGradient>
    <linearGradient id="greenDepth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#245E4A"/>
      <stop offset="100%" stop-color="#1B4D3E"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M40 4 L72 18 L72 42 C72 58 58 70 40 76 C22 70 8 58 8 42 L8 18 Z"/>
    </clipPath>
  </defs>

  <!-- Shield shape -->
  <path d="M40 4 L72 18 L72 42 C72 58 58 70 40 76 C22 70 8 58 8 42 L8 18 Z"
        fill="url(#greenDepth)" stroke="url(#goldShine)" stroke-width="2"/>

  <!-- Inner shield border (luxury detail) -->
  <path d="M40 9 L68 21 L68 42 C68 56 55.5 66.5 40 72 C24.5 66.5 12 56 12 42 L12 21 Z"
        fill="none" stroke="url(#goldShine)" stroke-width="0.6" opacity="0.5"/>

  <!-- House/roof icon inside shield -->
  <!-- Roof -->
  <path d="M40 22 L58 36 L55 36 L55 50 L25 50 L25 36 L22 36 Z"
        fill="none" stroke="url(#goldShine)" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Door -->
  <rect x="36" y="40" width="8" height="10" rx="1" fill="url(#goldShine)" opacity="0.9"/>

  <!-- Left window -->
  <rect x="28" y="38" width="5" height="5" rx="0.5" fill="none" stroke="url(#goldShine)" stroke-width="1" opacity="0.8"/>

  <!-- Right window -->
  <rect x="47" y="38" width="5" height="5" rx="0.5" fill="none" stroke="url(#goldShine)" stroke-width="1" opacity="0.8"/>

  <!-- Small chimney -->
  <rect x="49" y="27" width="4" height="7" rx="0.5" fill="url(#greenDepth)" stroke="url(#goldShine)" stroke-width="1"/>

  <!-- Wordmark: AsiaNest -->
  <text x="92" y="38" font-family="'Georgia', 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#1B4D3E" letter-spacing="1">
    Asia<tspan fill="url(#goldShine)">Nest</tspan>
  </text>

  <!-- Tagline -->
  <text x="93" y="56" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="9.5" fill="#1B4D3E" letter-spacing="4" opacity="0.65">
    LUXURY REAL ESTATE
  </text>

  <!-- Decorative line under tagline -->
  <line x1="93" y1="62" x2="173" y2="62" stroke="url(#goldShine)" stroke-width="0.8" opacity="0.5"/>
</svg>