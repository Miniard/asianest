<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C068"/>
      <stop offset="50%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#B8922E"/>
    </linearGradient>
    <linearGradient id="fGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#245E4A"/>
      <stop offset="100%" stop-color="#1B4D3E"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M32 3 L58 14.5 L58 34 C58 48 46 58 32 63 C18 58 6 48 6 34 L6 14.5 Z"
        fill="url(#fGreen)" stroke="url(#fGold)" stroke-width="2"/>

  <!-- Inner shield line -->
  <path d="M32 7.5 L54.5 17.5 L54.5 34 C54.5 46.5 43.5 55 32 59.5 C20.5 55 9.5 46.5 9.5 34 L9.5 17.5 Z"
        fill="none" stroke="url(#fGold)" stroke-width="0.7" opacity="0.4"/>

  <!-- Roof -->
  <path d="M32 18 L48 30 L45.5 30 L45.5 42 L18.5 42 L18.5 30 L16 30 Z"
        fill="none" stroke="url(#fGold)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Door -->
  <rect x="28.5" y="34" width="7" height="8" rx="1" fill="url(#fGold)" opacity="0.9"/>

  <!-- Left window -->
  <rect x="21.5" y="32.5" width="4.5" height="4.5" rx="0.5" fill="none" stroke="url(#fGold)" stroke-width="1.2" opacity="0.8"/>

  <!-- Right window -->
  <rect x="38" y="32.5" width="4.5" height="4.5" rx="0.5" fill="none" stroke="url(#fGold)" stroke-width="1.2" opacity="0.8"/>

  <!-- Chimney -->
  <rect x="40" y="23" width="3.5" height="6" rx="0.5" fill="url(#fGreen)" stroke="url(#fGold)" stroke-width="1.2"/>
</svg>